<!DOCTYPE html>
<html lang="fi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kirjatuminen</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
    <div class="login-container">
        <h1>Kirjaudu sisään</h1>
        <div id="viesti" class="form-message" role="alert" hidden></div>
        <form action="login.php" method="POST">
            <label for="username">Käyttäjänimi:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="email">Sähköposti:</label>
            <input type="email" id="email" name="email" required>

            <label for="password">Salasana:</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Kirjaudu</button>
        </form>
        <p>Ei tiliä? <a href="rekisteröityminen.html">Rekisteröidy täällä</a></p>
    </div>
    <script>
        const params = new URLSearchParams(window.location.search);
        const viesti = document.getElementById("viesti");

        if (params.has("onnistui")) {
            viesti.textContent = "Tili luotiin onnistuneesti. Voit nyt kirjautua sisään.";
            viesti.className = "form-message success";
            viesti.hidden = false;
        } else if (params.get("virhe") === "1") {
            viesti.textContent = "Käyttäjänimi, sähköposti tai salasana on virheellinen.";
            viesti.hidden = false;
        } else if (params.get("virhe") === "2") {
            viesti.textContent = "Kirjautumisessa tapahtui virhe.";
            viesti.hidden = false;
        }
    </script>
</body>
</html>
